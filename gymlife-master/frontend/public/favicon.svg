<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181d" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>

    <!-- Orange Fitness Brand Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7e29" />
      <stop offset="100%" stop-color="#f36100" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="orangeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#f36100" stroke-width="2" stroke-opacity="0.85" />

  <!-- Dumbbell Left Outer Plate -->
  <rect x="11" y="21" width="5" height="22" rx="2" fill="url(#orangeGrad)" />
  <!-- Dumbbell Left Inner Plate -->
  <rect x="18" y="16" width="5" height="32" rx="2.5" fill="url(#orangeGrad)" />
  <!-- Left Collar -->
  <rect x="23.5" y="27" width="2" height="10" rx="1" fill="#ffffff" />

  <!-- Dumbbell Center Bar -->
  <rect x="24" y="29.5" width="16" height="5" rx="1.5" fill="#ffffff" />

  <!-- Dynamic Energy Lightning Slash -->
  <path d="M33 19 L28 32 L33 32 L30 45 L41 30 L35 30 Z" fill="#f36100" filter="url(#orangeGlow)" opacity="0.95" />

  <!-- Right Collar -->
  <rect x="38.5" y="27" width="2" height="10" rx="1" fill="#ffffff" />
  <!-- Dumbbell Right Inner Plate -->
  <rect x="41" y="16" width="5" height="32" rx="2.5" fill="url(#orangeGrad)" />
  <!-- Dumbbell Right Outer Plate -->
  <rect x="48" y="21" width="5" height="22" rx="2" fill="url(#orangeGrad)" />
</svg>